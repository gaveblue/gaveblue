<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff7900"><title>Intervalo · Sem conexão</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#fff8f1;color:#162135;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:22px}
main{text-align:center;max-width:420px;background:#fff;border:1px solid #ffdbbd;border-radius:22px;padding:40px 26px;box-shadow:0 12px 35px #a657130f}
.brand{font-size:30px;letter-spacing:-1.5px;font-weight:900;font-style:italic}.brand:after{content:"";width:84px;height:5px;background:#ff7900;display:block;border-radius:20px;margin:-5px auto 20px;transform:rotate(-3deg)}
h1{font-size:24px;letter-spacing:-.6px;line-height:1.2}p{color:#697786;font-size:14px}button{background:#ff7600;color:#fff;border:0;border-radius:12px;padding:13px 23px;font-weight:800;font-size:15px;cursor:pointer;margin-top:9px}
</style></head><body><main><div class="brand">Intervalo</div><h1>Sem conexão com a internet</h1>
<p>Para proteger suas comandas, o Intervalo não confirma pedidos, baixas de estoque ou pagamentos offline. Conecte-se novamente e atualize a tela para verificar os dados.</p>
<button type="button" onclick="location.reload()">Tentar novamente</button></main></body></html>
