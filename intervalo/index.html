<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#15212b;background:#f8fafc}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #e6eaed;position:sticky;top:0;z-index:5}header .inner{max-width:1140px;margin:auto;min-height:72px;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px}.logo{font-weight:800;font-size:24px;letter-spacing:-1.5px}.logo span{color:#0c9e85}.logo small{font-size:10px;display:block;letter-spacing:.4px;font-weight:600;color:#64748b;margin-top:-3px}nav{display:flex;gap:12px;align-items:center}nav a{font-size:14px}.btn{border:0;border-radius:11px;background:#0d9488;color:white;font-weight:700;padding:12px 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:#0f766e}.btn.alt{color:#334155;background:#f1f5f9}.wrap{max-width:1140px;margin:auto;padding:42px 22px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;min-height:440px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:#0d9488;font-size:11px;font-weight:800}.hero h1{font-size:clamp(36px,5.4vw,66px);line-height:1.04;letter-spacing:-2.7px;margin:20px 0}.hero h1 span{color:#0d9488}.hero p{font-size:18px;color:#64748b;max-width:570px;line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.panel{border:1px solid #e2e8f0;background:#fff;border-radius:19px;padding:26px;box-shadow:0 12px 40px #0f172a0a}.panel h2{margin-top:0;letter-spacing:-.6px}.preview-row{display:flex;align-items:center;justify-content:space-between;padding:15px;border:1px solid #edf2f6;border-radius:12px;margin-top:10px}.preview-row strong{font-size:14px}.preview-row span{color:#64748b;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.feature{border:1px solid #e2e8f0;border-radius:15px;background:#fff;padding:20px}.feature b{display:block;margin-bottom:8px}.feature p{color:#64748b;font-size:13px;line-height:1.5}.section-title{font-size:30px;letter-spacing:-1.1px;margin-bottom:24px}.formbox{max-width:440px;margin:54px auto}.formbox h1{font-size:30px;letter-spacing:-1px}.muted{color:#64748b;line-height:1.65}form label{font-weight:650;color:#334155;font-size:13px;display:block;margin:18px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;outline:none}input:focus{border-color:#0d9488;box-shadow:0 0 0 3px #0d948820}.formbtn{width:100%;margin-top:22px}.error{color:#b42318;font-size:13px;margin-top:14px}.notice{color:#0f766e;background:#ecfdf5;padding:12px;border-radius:9px;font-size:13px}.cols{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}.item{border:1px solid #e2e8f0;border-radius:13px;padding:17px;background:#fff;margin:12px 0}.item h3{margin:0 0 6px}.item p{margin:0;color:#64748b;font-size:13px}.links{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.links a{font-size:12px;color:#0f766e;padding:8px 11px;background:#f0fdfa;border-radius:8px;font-weight:700}.tag{background:#eff6ff;color:#2563eb;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700}.foot{border-top:1px solid #e2e8f0;padding:24px;text-align:center;color:#94a3b8;font-size:12px;margin-top:40px}.skeleton{padding:70px;text-align:center;color:#64748b}.wait{color:#0f766e}.admin-list{margin-top:20px}.hidden{display:none}.hint{font-size:11px;color:#94a3b8;padding-top:10px}
@media(max-width:760px){.hero,.cols{grid-template-columns:1fr;gap:22px}.hero{min-height:0}.wrap{padding:32px 18px}.grid{grid-template-columns:1fr 1fr}.hero h1{letter-spacing:-1.8px}.hero p{font-size:16px}.panel{padding:19px}nav a{font-size:12px}}@media(max-width:410px){.grid{grid-template-columns:1fr}.preview{display:none}}

(function(){try{var deep=sessionStorage.getItem('intervalo.deepLink');if(deep&&deep.startsWith('/intervalo/')&&deep.length<2100){sessionStorage.removeItem('intervalo.deepLink');history.replaceState(null,'',deep+window.location.hash)}}catch(e){}})()

</head><body><header><div class="inner"><a class="logo" href="/intervalo/">intervalo<span>.</span><small>UM PRODUTO GAVEBLUE</small></a><nav id="nav"><a href="/intervalo/login">Entrar</a></nav></div></header><main id="app"><div class="skeleton">Carregando Intervalo...</div></main><footer class="foot">Gaveblue © 2026 · Intervalo 0.1.0 · Prévia técnica do PWA</footer>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/+esm';
const supabase=createClient('https://fynaaiazebydorzllwip.supabase.co','sb_publishable_mGpfDRlZ0MSaa9MV_xMJsg_FT47wa_d',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit',storageKey:'intervalo.auth.v1'}});
const app=document.getElementById('app'),nav=document.getElementById('nav');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(s)=>'/intervalo'+s;
const btn=(label,target)=>'<a class="btn" href="'+link(target)+'">'+label+'</a>';
const err=e=>'<p class="error" role="alert">'+esc(e?.message??String(e))+'</p>';
function box(content){app.innerHTML='<div class="wrap">'+content+'</div>'}
const modules=['gestao','garcom','cozinha','caixa','cardapio'], labels={gestao:'Gestão',garcom:'Garçom',cozinha:'Cozinha',caixa:'Caixa',cardapio:'Cardápio'};
const permissions={master:['gestao','garcom','cozinha','caixa','cardapio'],manager:['gestao','garcom','cozinha','caixa','cardapio'],waiter:['garcom','cardapio'],kitchen:['cozinha','cardapio'],cashier:['caixa','cardapio']};
const paths=location.pathname.replace(/^\/intervalo\/?/,'').split('/').filter(Boolean);
async function me(){const {data}=await supabase.auth.getUser();return data?.user??null}
async function setupNav(user){nav.innerHTML=user?'<a href="/intervalo/inicio">Meus restaurantes</a><a href="/intervalo/admin">Admin</a><button class="btn alt" id="exit">Sair</button>':'<a href="/intervalo/login">Entrar</a>';const exit=document.getElementById('exit');if(exit)exit.onclick=async()=>{await supabase.auth.signOut();location.assign(link('/login'))}}
async function home(user){box('<section class="hero"><div><span class="eyebrow">GAVEBLUE APRESENTA</span><h1>Seu restaurante.<br><span>Um só ritmo.</span></h1><p>Gestão, atendimento, cozinha e caixa conectados em uma plataforma multiempresa, com acesso por restaurante e função.</p><div class="actions">'+btn(user?'Meus restaurantes':'Acessar o Intervalo',user?'/inicio':'/login')+'<a class="btn alt" href="/">Conhecer Gaveblue</a></div><p class="hint">Fundação 0.1.0 · Ambiente piloto</p></div><div class="panel preview"><span class="eyebrow">SUA OPERAÇÃO EM UM SÓ LUGAR</span><h2>Seu estabelecimento</h2>'+modules.map(m=>'<div class="preview-row"><strong>'+labels[m]+'</strong><span>→</span></div>').join('')+'</div></section><h2 class="section-title">Módulos da plataforma</h2><section class="grid">'+modules.map(m=>'<article class="feature"><b>'+labels[m]+'</b><p>Estrutura do módulo preparada para desenvolvimento e homologação.</p><span class="tag">Em desenvolvimento</span></article>').join('')+'</section>')}
async function login(){box('<section class="formbox panel"><span class="eyebrow">ACESSO RESTRITO</span><h1>Bem-vindo de volta</h1><p class="muted">Entre com as credenciais do Intervalo. O cadastro de novos usuários é feito por convite.</p><form id="loginForm"><label>E-mail</label><input type="email" name="email" required autocomplete="email"><label>Senha</label><input type="password" name="password" required autocomplete="current-password"><button class="btn formbtn">Entrar</button><p id="feedback"></p></form><button class="btn alt" id="reset" style="margin-top:12px;width:100%">Esqueci minha senha</button></section>');document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=e.target;const feed=document.getElementById('feedback');feed.textContent='Autenticando...';const {data,error}=await supabase.auth.signInWithPassword({email:f.elements.namedItem('email').value.trim(),password:f.elements.namedItem('password').value});if(error){feed.innerHTML=err(error);return}if(data.user){const {data:pending}=await supabase.from('restaurant_members').select('restaurant_id').eq('user_id',data.user.id).eq('role','master').eq('status','pending').limit(1);if(pending?.length){const {error:activationError}=await supabase.functions.invoke('activate-master',{body:{}});if(activationError){feed.innerHTML='<p class="error">Login concluído, mas a ativação do Master não foi confirmada. Confira o convite.</p>';return}}}location.assign(link('/inicio'))};document.getElementById('reset').onclick=async()=>{const email=document.querySelector('input[name=email]').value.trim();if(!email){alert('Preencha seu e-mail.');return}const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+link('/redefinir')});document.getElementById('feedback').innerHTML=error?err(error):'<p class="notice">Se a conta existir, enviaremos um link de recuperação.</p>'}}
async function setPassword(mode){const user=await me();if(!user){box('<section class="panel formbox"><h2>Convite necessário</h2><p>Abra o link recebido por e-mail para definir uma senha.</p>'+btn('Ir ao login','/login')+'</section>');return}box('<section class="panel formbox"><span class="eyebrow">PRIMEIRO ACESSO</span><h1>Defina sua senha</h1><p class="muted">Use pelo menos 12 caracteres. Após definir a senha, faça login para ativar o Master.</p><form id="passForm"><label>Senha</label><input type="password" name="password" required minlength="12"><label>Confirmar</label><input type="password" name="confirm" required minlength="12"><button class="btn formbtn">Salvar senha</button><p id="feedback"></p></form></section>');document.getElementById('passForm').onsubmit=async e=>{e.preventDefault();const f=e.target;if(f.elements.namedItem('password').value!==f.elements.namedItem('confirm').value){document.getElementById('feedback').innerHTML='<p class="error">Senhas diferentes.</p>';return}const {error}=await supabase.auth.updateUser({password:f.elements.namedItem('password').value});if(error){document.getElementById('feedback').innerHTML=err(error);return}await supabase.auth.signOut();location.assign(link('/login'))}}
async function choose(user){const {data,error}=await supabase.from('restaurant_members').select('restaurant_id,role,status,restaurants(id,name,slug,status)').eq('user_id',user.id);if(error){box(err(error));return}let out='<h1>Meus restaurantes</h1><p class="muted">Escolha o restaurante para começar.</p>';if(!data?.length)out+='<div class="panel"><h2>Nenhum restaurante vinculado</h2><p>Peça ao Super Admin um convite para seu estabelecimento.</p></div>';for(const m of data??[]){const r=m.restaurants;if(!r)continue;out+='<article class="item"><span class="tag">'+esc(m.role)+'</span><h3>'+esc(r.name)+'</h3><p>/'+esc(r.slug)+' · '+(m.status==='active'?'Ativo':'Convite pendente')+'</p><div class="links">'+(m.status==='active'&&r.status==='active'?permissions[m.role].map(mod=>'<a href="'+link('/'+r.slug+'/'+mod)+'">'+labels[mod]+'</a>').join(''):'')+'</div></article>'}box(out)}
async function admin(user){const {data:allowed}=await supabase.from('platform_admins').select('user_id').eq('user_id',user.id).eq('active',true).maybeSingle();if(!allowed){box('<section class="panel"><h1>Super Admin restrito</h1><p>Sua conta não tem permissão de administrador Gaveblue.</p></section>');return}const {data:list,error}=await supabase.from('restaurants').select('id,name,slug,status').order('created_at',{ascending:false});box('<h1>Super Admin Gaveblue</h1><p class="muted">Cadastre restaurantes e convide o responsável Master.</p><div class="cols"><section class="panel"><h2>Novo restaurante</h2><form id="newRestaurant"><label>Nome do estabelecimento</label><input required name="name" minlength="2" maxlength="120"><label>Slug da URL</label><input required name="slug" minlength="3" maxlength="60" pattern="[a-z0-9]+(-[a-z0-9]+)*"><label>E-mail do Master</label><input required name="master_email" type="email"><button class="btn formbtn">Cadastrar e convidar</button><p id="feedback"></p></form></section><section class="panel"><h2>Restaurantes cadastrados</h2>'+(error?err(error):list?.length?list.map(r=>'<div class="preview-row"><div><strong>'+esc(r.name)+'</strong><p class="muted">/'+esc(r.slug)+'</p></div><span>'+esc(r.status)+'</span></div>').join(''):'<p class="muted">Nenhum restaurante cadastrado.</p>')+'</section></div>');document.getElementById('newRestaurant').onsubmit=async e=>{e.preventDefault();const f=e.target,feedback=document.getElementById('feedback');feedback.innerHTML='<p class="wait">Cadastrando...</p>';const {data,error}=await supabase.functions.invoke('admin-provision',{body:{name:f.elements.namedItem('name').value.trim(),slug:f.elements.namedItem('slug').value.trim(),master_email:f.elements.namedItem('master_email').value.trim().toLowerCase()}});if(error||!data?.restaurant){feedback.innerHTML=err(error??new Error(data?.error??'Falha no cadastro'));return}feedback.innerHTML='<p class="notice">Restaurante criado e convite enviado. Atualize para ver a lista.</p>';f.reset()}}
async function tenant(user,slug,mod){if(mod==='cardapio'){box('<section class="panel formbox"><span class="eyebrow">CARDÁPIO DIGITAL</span><h1>Em preparação</h1><p>O cardápio público ainda não está publicado para este estabelecimento.</p>'+btn('Voltar','/')+'</section>');return}if(!user){location.assign(link('/login'));return}const {data:membership,error}=await supabase.from('restaurant_members').select('restaurant_id,role,status,restaurants(id,name,slug,status)').eq('user_id',user.id);if(error){box(err(error));return}const m=membership?.find(x=>x.restaurants?.slug===slug&&x.status==='active'&&x.restaurants.status==='active'&&(permissions[x.role]??[]).includes(mod));if(!m){box('<section class="panel"><h1>Acesso não autorizado</h1><p>Sua conta não possui permissão para este restaurante e módulo.</p></section>');return}const {data:flags}=await supabase.from('restaurant_modules').select('enabled').eq('restaurant_id',m.restaurant_id).eq('module',mod).maybeSingle();if(!flags?.enabled){box('<section class="panel"><h1>Módulo em desenvolvimento</h1><p>Este recurso ainda não foi habilitado para o restaurante.</p></section>');return}box('<span class="eyebrow">AMBIENTE DO RESTAURANTE</span><h1>'+labels[mod]+'</h1><p class="muted">'+esc(m.restaurants.name)+' · '+esc(m.role)+'</p><section class="panel"><h2>Estrutura preparada</h2><p>As operações serão disponibilizadas nas próximas versões. Seus dados estão segregados por estabelecimento.</p>'+btn('Trocar restaurante','/inicio')+'</section>')}
async function start(){const user=await me();await setupNav(user);if(paths.length===0)return home(user);if(paths[0]==='login')return login();if(paths[0]==='ativar')return setPassword('activation');if(paths[0]==='redefinir')return setPassword('recovery');if(paths[0]==='inicio')return user?choose(user):location.assign(link('/login'));if(paths[0]==='admin')return user?admin(user):location.assign(link('/login'));if(paths.length===2&&modules.includes(paths[1])&&/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(paths[0]))return tenant(user,paths[0],paths[1]);box('<h1>Página não encontrada</h1>'+btn('Início','/'))}
start().catch(e=>{app.innerHTML='<div class="wrap"><section class="panel"><h1>Não foi possível iniciar o Intervalo</h1><p class="error">'+esc(e.message)+'</p><p>Verifique sua conexão e atualize a página.</p></section></div>'});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/intervalo/sw.js',{scope:'/intervalo/'}).catch(()=>{}));
</script>
