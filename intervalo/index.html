async function login(){
 box('<section class="formbox panel"><span class="eyebrow">ACESSO AO INTERVALO</span><h1>Bem-vindo de volta</h1><p class="muted">Entre com e-mail ou CPF e sua senha. O CPF fica disponível após ser vinculado à sua conta.</p><form id="loginForm"><label for="login-id">E-mail ou CPF</label><input id="login-id" type="text" name="identifier" required maxlength="254" autocomplete="username" placeholder="Seu e-mail ou CPF"><label for="login-pass">Senha</label><input id="login-pass" type="password" name="password" required autocomplete="current-password"><button class="btn formbtn" type="submit">Entrar</button><p id="feedback" role="status" aria-live="polite"></p></form><button class="btn alt" id="reset" style="margin-top:12px;width:100%">Esqueci minha senha</button><p class="hint">Primeiro acesso da Gaveblue? <a href="/intervalo/configurar-admin" style="color:#0f766e;font-weight:700">Ativar Super Admin</a></p></section>');
 document.getElementById('loginForm').onsubmit=async e=>{
   e.preventDefault();
   const form=e.currentTarget;
   const feed=document.getElementById('feedback');
   const identifier=form.elements.namedItem('identifier').value.trim();
   const password=form.elements.namedItem('password').value;
   const submit=form.querySelector('button[type="submit"]');
   submit.disabled=true;feed.textContent='Validando acesso...';
   let response;
   try{
     if(identifier.includes('@')){
       response=await supabase.auth.signInWithPassword({email:identifier,password});
     }else{
       if(!/^[\d\s.\-]+$/.test(identifier)||identifier.replace(/\D/g,'').length!==11){
         feed.innerHTML='<span class="error">Digite um e-mail ou CPF válido.</span>';return;
       }
       const result=await supabase.functions.invoke('cpf-login',{body:{cpf:identifier,password}});
       if(result.error||!result.data?.access_token||!result.data?.refresh_token){
         let message='CPF ou senha incorretos.';
         if(result.error?.context?.status===429)message='Muitas tentativas. Tente novamente mais tarde.';
         feed.innerHTML='<span class="error">'+message+'</span>';return;
       }
       response=await supabase.auth.setSession({access_token:result.data.access_token,refresh_token:result.data.refresh_token});
     }
     if(response.error||!response.data?.user){feed.innerHTML='<span class="error">Não foi possível entrar. Verifique suas credenciais.</span>';return}
     const user=response.data.user;
     if(user.app_metadata?.intervalo_password_change_required){location.assign(link('/trocar-senha'));return}
     const {data:pending}=await supabase.from('restaurant_members').select('restaurant_id').eq('user_id',user.id).eq('role','master').eq('status','pending').limit(1);
     if(pending?.length){
       const {error:activationError}=await supabase.functions.invoke('activate-master',{body:{password}});
       if(activationError){location.assign(link('/inicio'));return}
     }
     const {data:adminAccess}=await supabase.from('platform_admins').select('user_id').eq('user_id',user.id).eq('active',true).maybeSingle();
     location.assign(link(adminAccess?'/admin':'/inicio'));
   }catch{
     feed.innerHTML='<span class="error">Não foi possível entrar. Tente novamente.</span>';
   }finally{submit.disabled=false}
 };
 document.getElementById('reset').onclick=()=>location.assign(link('/recuperar-senha'));
}
async function recovery(){
 box('<section class="formbox panel"><span class="eyebrow">INTERVALO · RECUPERAÇÃO</span><h1>Recuperar senha</h1><p class="muted">Informe o e-mail cadastrado. Se a entrega de e-mails do projeto estiver configurada, você receberá um link para criar uma nova senha.</p><form id="recoveryForm"><label>E-mail da conta</label><input name="email" type="email" autocomplete="email" required><button class="btn formbtn" type="submit">Enviar link de recuperação</button><p id="feedback" role="status" aria-live="polite"></p></form><p class="hint">Não recebeu o e-mail? Confira spam. Se o envio ainda não estiver configurado, solicite ao Super Admin uma senha provisória. Ele não tem acesso à sua senha antiga.</p><a href="/intervalo/login">Voltar ao login</a></section>');
 document.getElementById('recoveryForm').onsubmit=async e=>{
  e.preventDefault();const f=e.currentTarget,feedback=document.getElementById('feedback'),btn=f.querySelector('button');
  btn.disabled=true;
  const email=f.elements.namedItem('email').value.trim();
  try{
   const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+link('/redefinir')});
   if(error){feedback.textContent='Não foi possível enviar o e-mail. O serviço de e-mails pode não estar configurado ou ter atingido o limite. Solicite senha provisória ao Super Admin.';feedback.className='error';return}
   feedback.textContent='Se esse e-mail estiver cadastrado e o envio estiver habilitado, você receberá as instruções. Confira spam e lixo eletrônico.';
   feedback.className='notice';
  }catch{feedback.textContent='Serviço indisponível. Solicite uma senha provisória ao Super Admin.';feedback.className='error'}
  finally{btn.disabled=false}
 };
}
async function changePassword(user){
 if(!user){location.assign(link('/login'));return}
 const forced=!!user.app_metadata?.intervalo_password_change_required;
 box('<section class="formbox panel"><span class="eyebrow">SEGURANÇA DA CONTA</span><h1>'+(forced?'Troca de senha obrigatória':'Alterar minha senha')+'</h1><p class="muted">'+(forced?'A senha provisória precisa ser substituída antes de acessar os dados do restaurante.':'Confirme sua senha atual e escolha uma nova.')+'</p><form id="changePassForm"><label>Senha atual'+(forced?' (provisória)':'')+'</label><input name="current_password" type="password" autocomplete="current-password" required><label>Nova senha (mínimo 12 caracteres)</label><input name="new_password" type="password" autocomplete="new-password" required minlength="12"><label>Confirmar nova senha</label><input name="confirm" type="password" autocomplete="new-password" required minlength="12"><button class="btn formbtn">Salvar nova senha</button><p id="feedback" role="status" aria-live="polite"></p></form><p class="hint">Após salvar, entre novamente com a nova senha.</p></section>');
 document.getElementById('changePassForm').onsubmit=async e=>{
  e.preventDefault();const f=e.currentTarget,feedback=document.getElementById('feedback'),btn=f.querySelector('button');
  const current_password=f.elements.namedItem('current_password').value;
  const new_password=f.elements.namedItem('new_password').value;
  if(new_password!==f.elements.namedItem('confirm').value){feedback.className='error';feedback.textContent='As novas senhas não coincidem.';return}
  if(new_password===current_password){feedback.className='error';feedback.textContent='Escolha uma senha diferente.';return}
  btn.disabled=true;feedback.textContent='Alterando senha...';
  try{
   const {data,error}=await supabase.functions.invoke('account-password',{body:{current_password,new_password}});
   if(error||!data?.changed){let msg=data?.error??error?.message??'Falha ao atualizar';try{const body=await error?.context?.json?.();if(body?.error)msg=body.error}catch{}feedback.className='error';feedback.textContent=msg;return}
   await supabase.auth.signOut();
   location.assign(link('/login'));
  }catch{feedback.className='error';feedback.textContent='Erro de conexão. Tente novamente.'}
  finally{btn.disabled=false}
 };
}

 box('<section class="formbox panel"><span class="eyebrow">GAVEBLUE · PRIMEIRO ACESSO</span><h1>Ativar Super Admin</h1><p class="muted">Apenas o endereço de e-mail autorizado previamente no banco pode receber a função de Super Admin. Crie sua senha e confirme a titularidade pelo e-mail recebido.</p><form id="initialAdminForm"><label>E-mail autorizado</label><input type="email" name="email" required autocomplete="email" maxlength="254"><label>Criar senha (mínimo 12 caracteres)</label><input type="password" name="password" required minlength="12" autocomplete="new-password"><label>Confirmar senha</label><input type="password" name="confirm" required minlength="12" autocomplete="new-password"><button class="btn formbtn" type="submit">Criar acesso</button><div id="feedback" aria-live="polite"></div></form><p class="hint">Este primeiro cadastro é único. Outros acessos serão concedidos por convites, nunca por cadastro público de administradores.</p></section>');
 document.getElementById('initialAdminForm').onsubmit=async e=>{

  const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+link('/login')}});
  if(error){feedback.innerHTML=err(error);return}

 }

async function setPassword(mode){const user=await me();if(!user){box('<section class="panel formbox"><h2>Convite necessário</h2><p>Abra o link recebido por e-mail para definir uma senha.</p>'+btn('Ir ao login','/login')+'</section>');return}box('<section class="panel formbox"><span class="eyebrow">PRIMEIRO ACESSO</span><h1>Defina sua senha</h1><p class="muted">Use pelo menos 12 caracteres. Após definir a senha, faça login para ativar o Master.</p><form id="passForm"><label>Senha</label><input type="password" name="password" required minlength="12"><label>Confirmar</label><input type="password" name="confirm" required minlength="12"><button class="btn formbtn">Salvar senha</button><p id="feedback"></p></form></section>');document.getElementById('passForm').onsubmit=async e=>{e.preventDefault();const f=e.target;if(f.elements.namedItem('password').value!==f.elements.namedItem('confirm').value){document.getElementById('feedback').innerHTML='<p class="error">Senhas diferentes.</p>';return}const {error}=await supabase.auth.updateUser({password:f.elements.namedItem('password').value});if(error){document.getElementById('feedback').innerHTML=err(error);return}await supabase.auth.signOut();location.assign(link('/login'))}}
async function choose(user){
 const [{data,error},{data:flags,error:fe},{data:overrides,error:oe}]=await Promise.all([
   supabase.from('restaurant_members').select('restaurant_id,role,status,restaurants(id,name,slug,status)').eq('user_id',user.id),
   supabase.from('restaurant_modules').select('restaurant_id,module,enabled'),
   supabase.from('restaurant_member_module_access').select('restaurant_id,module,allowed').eq('user_id',user.id)
 ]);
 if(error||fe||oe){box(err(error??fe??oe));return}
 let out='<h1>Meus restaurantes</h1><p class="muted">Escolha um estabelecimento. Você pode trabalhar em vários restaurantes usando o mesmo login, com permissões diferentes.</p>';
 if(!data?.length)out+='<section class="panel"><h2>Nenhum restaurante vinculado</h2><p>Aguarde o convite do responsável ou abra o painel Super Admin, se sua conta tiver autorização.</p><a class="btn" href="'+link('/admin')+'">Painel administrativo</a></section>';
 for(const m of data??[]){
   const r=m.restaurants;if(!r)continue;
   out+='<article class="item"><span class="tag">'+esc(m.role)+'</span><h3>'+esc(r.name)+'</h3><p>/'+esc(r.slug)+' · '+(m.status==='active'?'Ativo':m.status==='pending'?'Convite pendente':'Acesso revogado')+'</p><div class="links">';
   if(m.status==='active'&&r.status==='active'){
     for(const mod of modules){
       const enabled=(flags??[]).find(f=>f.restaurant_id===m.restaurant_id&&f.module===mod)?.enabled;
       const override=(overrides??[]).find(f=>f.restaurant_id===m.restaurant_id&&f.module===mod);
       const permitted=m.role==='master'||(override?override.allowed:(permissions[m.role]??[]).includes(mod));
       if(enabled&&permitted)out+='<a href="'+link('/'+r.slug+'/'+mod)+'">'+labels[mod]+'</a>';
     }
   }else if(m.status==='pending'){
     if(m.role==='master')out+='<form data-master-activate="'+esc(m.restaurant_id)+'" style="width:100%;margin:10px 0"><label style="display:block;font-size:12px;font-weight:700;margin:10px 0">Confirme a senha desta conta para ativar o vínculo Master</label><input type="password" name="password" autocomplete="current-password" required placeholder="Senha da conta"><button class="btn" style="margin-top:9px" type="submit">Ativar acesso Master</button><p class="hint" role="status"></p></form>';
     else out+='<button class="smallbtn" type="button" data-accept="'+esc(m.restaurant_id)+'">Aceitar convite</button>';
   }
   out+='</div></article>';
 }
 box(out);
 document.querySelectorAll('form[data-master-activate]').forEach(form=>form.onsubmit=async e=>{
    e.preventDefault();
    const button=form.querySelector('button'),message=form.querySelector('p'),password=form.elements.namedItem('password').value;
    button.disabled=true;message.textContent='Validando acesso...';
    try{
      const {data,error}=await supabase.functions.invoke('activate-master',{body:{password}});
      if(error||!data?.activated){let reason=data?.error??error?.message??'Não foi possível ativar';try{const info=await error?.context?.json?.();reason=info?.error??reason}catch{}message.textContent=reason;return}
      location.reload();
    }catch{message.textContent='Falha de conexão. Tente novamente.'}
    finally{button.disabled=false;form.elements.namedItem('password').value=''}
 });
 document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{
    const {data,error}=await supabase.functions.invoke('restaurant-team',{body:{restaurant_id:b.dataset.accept,action:'accept'}});
    if(error||data?.error){alert(data?.error??error?.message??'Convite não pôde ser aceito.');return}
    location.reload();
 });
}

async function start(){const user=await me();if(user?.app_metadata?.intervalo_password_change_required&&!['trocar-senha','login','redefinir','recuperar-senha'].includes(paths[0])){location.assign(link('/trocar-senha'));return}await setupNav(user);if(paths.length===0)return home(user);if(paths[0]==='login')return login();if(paths[0]==='recuperar-senha')return recovery();if(paths[0]==='trocar-senha')return changePassword(user);if(paths[0]==='minha-conta')return account(user);if(paths[0]==='configurar-admin')return setupFirstAdmin();if(paths[0]==='ativar')return setPassword('activation');if(paths[0]==='redefinir')return setPassword('recovery');if(paths[0]==='inicio')return user?choose(user):location.assign(link('/login'));if(paths[0]==='admin')return user?admin(user):location.assign(link('/login'));if(paths.length===2&&(modules.includes(paths[1])||internalModules.includes(paths[1]))&&/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(paths[0]))return tenant(user,paths[0],paths[1]);box('<h1>Página não encontrada</h1>'+btn('Início','/'))}
start().catch(e=>{app.innerHTML='<div class="wrap"><section class="panel"><h1>Não foi possível iniciar o Intervalo</h1><p class="error">'+esc(e.message)+'</p><p>Verifique sua conexão e atualize a página.</p></section></div>'});
