<script>
/* Identidade distinta para o PWA Garçom; reavaliar depois do fallback da rota. */
function intervaloApplyManifest(){
 const path=location.pathname,query=new URLSearchParams(location.search);
 const waiter=path==='/intervalo/garcom'||/\/intervalo\/[a-z0-9-]+\/garcom\/?$/.test(path)
  ||query.get('app')==='garcom'||query.get('destino')==='garcom';
 document.querySelector('link[rel="manifest"]').href=waiter
  ?'/intervalo/manifest-garcom.webmanifest':'/intervalo/manifest.webmanifest';
 document.querySelector('meta[name="theme-color"]').content=waiter?'#ff7900':'#ff7600';
}
intervaloApplyManifest();
</script>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/+esm';
import {icon} from '/intervalo/ui-icons.js?v=1.0.0-rc.1';
const supabase=createClient('https://fynaaiazebydorzllwip.supabase.co','sb_publishable_mGpfDRlZ0MSaa9MV_xMJsg_FT47wa_d',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit',storageKey:'intervalo.auth.v1'}});
const app=document.getElementById('app'),nav=document.getElementById('nav');
let intervaloInstallEvent=null;

window.intervaloInstallGarcom=async()=>{
 if(intervaloInstallEvent){

 }
};

const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(s)=>'/intervalo'+s;
const btn=(label,target)=>'<a class="btn" href="'+link(target)+'">'+label+'</a>';
const err=e=>'<p class="error" role="alert">'+esc(e?.message??String(e))+'</p>';
function box(content){app.innerHTML='<div class="wrap">'+content+'</div>'}
const modules=['gestao','garcom','cozinha','caixa','cardapio'], labels={gestao:'Gestão',garcom:'Garçom',cozinha:'Cozinha',caixa:'Caixa',cardapio:'Cardápio'};
const permissions={master:['gestao','garcom','cozinha','caixa','cardapio'],manager:['gestao','garcom','cozinha','caixa','cardapio'],waiter:['garcom','cardapio'],kitchen:['cozinha','cardapio'],cashier:['caixa','cardapio']};
// Restaura URLs /intervalo/* quando GitHub Pages usa 404.html como fallback.
try{
 if(location.pathname==='/intervalo/'||location.pathname==='/intervalo'){
   const requested=sessionStorage.getItem('intervalo.deepLink');
   if(requested){
     sessionStorage.removeItem('intervalo.deepLink');
     const u=new URL(requested,location.origin);
     if(u.origin===location.origin&&u.pathname.startsWith('/intervalo/')&&u.pathname!=='/intervalo/'&&u.pathname.length<230){
       history.replaceState({},'',u.pathname+u.search+location.hash);
     }
   }
 }
}catch{/* Navegação normal permanece disponível sem sessionStorage */}
const paths=location.pathname.replace(/^\/intervalo\/?/,'').split('/').filter(Boolean);
async function me(){const {data}=await supabase.auth.getUser();return data?.user??null}

 document.getElementById('exit').onclick=async()=>{await supabase.auth.signOut();location.assign(link('/login'))};
}

 const modulesUI=[

  ['package','Estoque','Ficha técnica, entradas e alertas.']

 const content='<section class="iv-home-hero"><div><span class="iv-section-caption">GAVEBLUE APRESENTA</span><h1>Seu restaurante.<br><span>Um só ritmo.</span></h1><p>Tudo o que sua equipe precisa para atender, preparar e organizar seus pedidos — com uma experiência simples do celular ao computador.</p><div class="iv-actions"><a class="iv-btn" href="'+link(user?'/inicio':'/login')+'">'+icon('arrowRight',18)+(user?' Meus restaurantes':' Acessar Intervalo')+'</a><a class="iv-btn secondary" href="'+link('/?app=garcom')+'">'+icon('phone',17)+' PWA Garçom</a></div><p class="iv-muted">Prévia 1.0.0 RC · Impressão manual · Sem emissão fiscal ou e-mails nesta versão</p></div><div class="iv-home-preview">'+icon('store',42)+'<h2>Uma interface para cada função</h2><p>Garçom, cozinha, caixa e gestão integrados por restaurante.</p><div class="iv-home-tiles">'+modulesUI.slice(1,5).map(([ic,name])=>'<span>'+icon(ic,23)+esc(name)+'</span>').join('')+'</div></div></section>'

 +modulesUI.map(([ic,name,desc])=>'<article class="iv-feature-tile"><span class="iv-feature-icon">'+icon(ic,25)+'</span><span><strong>'+esc(name)+'</strong><small>'+esc(desc)+'</small></span></article>').join('')+'</div></section>';

}
async function login(){
 box('<section class="formbox panel"><span class="eyebrow">ACESSO AO INTERVALO</span><h1>Bem-vindo de volta</h1><p class="muted">Entre com e-mail ou CPF e sua senha. O CPF fica disponível após ser vinculado à sua conta.</p><form id="loginForm"><label for="login-id">E-mail ou CPF</label><input id="login-id" type="text" name="identifier" required maxlength="254" autocomplete="username" placeholder="Seu e-mail ou CPF"><label for="login-pass">Senha</label><input id="login-pass" type="password" name="password" required autocomplete="current-password"><button class="btn formbtn" type="submit">Entrar</button><p id="feedback" role="status" aria-live="polite"></p></form><button class="btn alt" id="reset" style="margin-top:12px;width:100%">Esqueci minha senha</button><p class="hint">Novos funcionários recebem acesso diretamente do Master ou Super Admin, com senha provisória.</p></section>');
 document.getElementById('loginForm').onsubmit=async e=>{
   e.preventDefault();
   const form=e.currentTarget;
   const feed=document.getElementById('feedback');
   const identifier=form.elements.namedItem('identifier').value.trim();
   const password=form.elements.namedItem('password').value;
   const submit=form.querySelector('button[type="submit"]');
   submit.disabled=true;feed.textContent='Validando acesso...';
   let response;
   try{
     if(identifier.includes('@')){
       response=await supabase.auth.signInWithPassword({email:identifier,password});
     }else{
       if(!/^[\d\s.\-]+$/.test(identifier)||identifier.replace(/\D/g,'').length!==11){
         feed.innerHTML='<span class="error">Digite um e-mail ou CPF válido.</span>';return;
       }
       const result=await supabase.functions.invoke('cpf-login',{body:{cpf:identifier,password}});
       if(result.error||!result.data?.access_token||!result.data?.refresh_token){
         let message='CPF ou senha incorretos.';
         if(result.error?.context?.status===429)message='Muitas tentativas. Tente novamente mais tarde.';
         feed.innerHTML='<span class="error">'+message+'</span>';return;
       }
       response=await supabase.auth.setSession({access_token:result.data.access_token,refresh_token:result.data.refresh_token});
     }
     if(response.error||!response.data?.user){feed.innerHTML='<span class="error">Não foi possível entrar. Verifique suas credenciais.</span>';return}
     const user=response.data.user;
     if(user.app_metadata?.intervalo_password_change_required){location.assign(link('/trocar-senha'));return}
     const {data:pending}=await supabase.from('restaurant_members').select('restaurant_id').eq('user_id',user.id).eq('role','master').eq('status','pending').limit(1);
     if(pending?.length){
       const {error:activationError}=await supabase.functions.invoke('activate-master',{body:{password}});
       if(activationError){location.assign(link('/inicio'));return}
     }
     const {data:adminAccess}=await supabase.from('platform_admins').select('user_id').eq('user_id',user.id).eq('active',true).maybeSingle();
     location.assign(link(new URLSearchParams(location.search).get('destino')==='garcom'?'/?app=garcom':adminAccess?'/admin':'/inicio'));
   }catch{
     feed.innerHTML='<span class="error">Não foi possível entrar. Tente novamente.</span>';
   }finally{submit.disabled=false}
 };
 document.getElementById('reset').onclick=()=>location.assign(link('/recuperar-senha'));
}
async function recovery(){
 box('<section class="formbox panel"><span class="eyebrow">INTERVALO · ACESSO</span><h1>Precisa de uma nova senha?</h1><p class="muted">Por enquanto o Intervalo não envia links por e-mail. Para recuperar seu acesso, solicite ao Super Admin uma senha provisória. O administrador precisa confirmar a própria senha para redefinir a sua.</p><p class="notice">O novo acesso exige que você troque a senha provisória no primeiro login. Sua senha anterior deixará de funcionar.</p><p class="hint"><b>Super Admin:</b> a senha da própria conta administrativa não pode ser redefinida por esse recurso; utilize os meios seguros de recuperação da conta no painel Supabase.</p><a class="btn alt" href="/intervalo/login">Voltar ao login</a></section>');
}
async function changePassword(user){
 if(!user){location.assign(link('/login'));return}
 const forced=!!user.app_metadata?.intervalo_password_change_required;
 box('<section class="formbox panel"><span class="eyebrow">SEGURANÇA DA CONTA</span><h1>'+(forced?'Troca de senha obrigatória':'Alterar minha senha')+'</h1><p class="muted">'+(forced?'A senha provisória precisa ser substituída antes de acessar os dados do restaurante.':'Confirme sua senha atual e escolha uma nova.')+'</p><form id="changePassForm"><label>Senha atual'+(forced?' (provisória)':'')+'</label><input name="current_password" type="password" autocomplete="current-password" required><label>Nova senha (mínimo 12 caracteres)</label><input name="new_password" type="password" autocomplete="new-password" required minlength="12"><label>Confirmar nova senha</label><input name="confirm" type="password" autocomplete="new-password" required minlength="12"><button class="btn formbtn">Salvar nova senha</button><p id="feedback" role="status" aria-live="polite"></p></form><p class="hint">Após salvar, entre novamente com a nova senha.</p></section>');
 document.getElementById('changePassForm').onsubmit=async e=>{
  e.preventDefault();const f=e.currentTarget,feedback=document.getElementById('feedback'),btn=f.querySelector('button');
  const current_password=f.elements.namedItem('current_password').value;
  const new_password=f.elements.namedItem('new_password').value;
  if(new_password!==f.elements.namedItem('confirm').value){feedback.className='error';feedback.textContent='As novas senhas não coincidem.';return}
  if(new_password===current_password){feedback.className='error';feedback.textContent='Escolha uma senha diferente.';return}
  btn.disabled=true;feedback.textContent='Alterando senha...';
  try{
   const {data,error}=await supabase.functions.invoke('account-password',{body:{current_password,new_password}});
   if(error||!data?.changed){let msg=data?.error??error?.message??'Falha ao atualizar';try{const body=await error?.context?.json?.();if(body?.error)msg=body.error}catch{}feedback.className='error';feedback.textContent=msg;return}
   await supabase.auth.signOut();
   location.assign(link('/login'));
  }catch{feedback.className='error';feedback.textContent='Erro de conexão. Tente novamente.'}
  finally{btn.disabled=false}
 };
}
async function setupFirstAdmin(){
 const user=await me();
 if(user){
  const {data:allowed}=await supabase.from('platform_admins').select('user_id').eq('user_id',user.id).eq('active',true).maybeSingle();
  if(allowed){location.assign(link('/admin'));return}
 }
 box('<section class="formbox panel"><span class="eyebrow">GAVEBLUE · ADMINISTRAÇÃO</span><h1>Cadastro inicial encerrado</h1><p class="muted">O Super Admin do Intervalo já está configurado. Por segurança, não existe cadastro público de novos administradores nem envio de ativação por e-mail nesta etapa.</p><p class="hint">Se você já possui acesso, utilize o login. A recuperação da própria conta de Super Admin deve ser feita diretamente no Supabase, com a autorização do titular.</p><a class="btn" href="/intervalo/login">Ir ao login</a></section>');
}
async function setPassword(mode){const user=await me();if(!user){box('<section class="panel formbox"><h2>Convite necessário</h2><p>Abra o link recebido por e-mail para definir uma senha.</p>'+btn('Ir ao login','/login')+'</section>');return}box('<section class="panel formbox"><span class="eyebrow">PRIMEIRO ACESSO</span><h1>Defina sua senha</h1><p class="muted">Use pelo menos 12 caracteres. Após definir a senha, faça login para ativar o Master.</p><form id="passForm"><label>Senha</label><input type="password" name="password" required minlength="12"><label>Confirmar</label><input type="password" name="confirm" required minlength="12"><button class="btn formbtn">Salvar senha</button><p id="feedback"></p></form></section>');document.getElementById('passForm').onsubmit=async e=>{e.preventDefault();const f=e.target;if(f.elements.namedItem('password').value!==f.elements.namedItem('confirm').value){document.getElementById('feedback').innerHTML='<p class="error">Senhas diferentes.</p>';return}const {error}=await supabase.auth.updateUser({password:f.elements.namedItem('password').value});if(error){document.getElementById('feedback').innerHTML=err(error);return}await supabase.auth.signOut();location.assign(link('/login'))}}
async function choose(user){
 const [{data,error},{data:flags,error:fe},{data:overrides,error:oe}]=await Promise.all([
   supabase.from('restaurant_members').select('restaurant_id,role,status,restaurants(id,name,slug,status)').eq('user_id',user.id),
   supabase.from('restaurant_modules').select('restaurant_id,module,enabled'),
   supabase.from('restaurant_member_module_access').select('restaurant_id,module,allowed').eq('user_id',user.id)
 ]);
 if(error||fe||oe){box(err(error??fe??oe));return}
 let out='<div class="iv-header"><div><span class="iv-section-caption">SEU ESPAÇO</span><h1>Meus restaurantes</h1><p>Selecione um estabelecimento para continuar.</p></div><a class="iv-btn secondary" href="'+link('/?app=garcom')+'">'+icon('phone',17)+' PWA do Garçom</a></div>';
 if(!data?.length)out+='<section class="panel"><h2>Nenhum restaurante vinculado</h2><p>Aguarde o convite do responsável ou abra o painel Super Admin, se sua conta tiver autorização.</p><a class="btn" href="'+link('/admin')+'">Painel administrativo</a></section>';
 for(const m of data??[]){
   const r=m.restaurants;if(!r)continue;
   out+='<article class="item"><span class="iv-chip orange">'+icon('shield',14)+esc(m.role)+'</span><h3>'+icon('store',20)+' '+esc(r.name)+'</h3><p>/'+esc(r.slug)+' · '+(m.status==='active'?'Ativo':m.status==='pending'?'Convite pendente':'Acesso revogado')+'</p><div class="links">';
   if(m.status==='active'&&r.status==='active'){
     for(const mod of modules){
       const enabled=(flags??[]).find(f=>f.restaurant_id===m.restaurant_id&&f.module===mod)?.enabled;
       const override=(overrides??[]).find(f=>f.restaurant_id===m.restaurant_id&&f.module===mod);
       const permitted=m.role==='master'||(override?override.allowed:(permissions[m.role]??[]).includes(mod));
       if(enabled&&permitted)out+='<a href="'+link('/'+r.slug+'/'+mod)+'">'+icon({gestao:'dashboard',garcom:'utensils',cozinha:'chef',caixa:'register',cardapio:'receipt'}[mod],15)+labels[mod]+'</a>';
     }
   }else if(m.status==='pending'){
     if(m.role==='master')out+='<form data-master-activate="'+esc(m.restaurant_id)+'" style="width:100%;margin:10px 0"><label style="display:block;font-size:12px;font-weight:700;margin:10px 0">Confirme a senha desta conta para ativar o vínculo Master</label><input type="password" name="password" autocomplete="current-password" required placeholder="Senha da conta"><button class="btn" style="margin-top:9px" type="submit">Ativar acesso Master</button><p class="hint" role="status"></p></form>';
     else out+='<button class="smallbtn" type="button" data-accept="'+esc(m.restaurant_id)+'">Aceitar convite</button>';
   }
   out+='</div></article>';
 }
 box(out);
 document.querySelectorAll('form[data-master-activate]').forEach(form=>form.onsubmit=async e=>{
    e.preventDefault();
    const button=form.querySelector('button'),message=form.querySelector('p'),password=form.elements.namedItem('password').value;
    button.disabled=true;message.textContent='Validando acesso...';
    try{
      const {data,error}=await supabase.functions.invoke('activate-master',{body:{password}});
      if(error||!data?.activated){let reason=data?.error??error?.message??'Não foi possível ativar';try{const info=await error?.context?.json?.();reason=info?.error??reason}catch{}message.textContent=reason;return}
      location.reload();
    }catch{message.textContent='Falha de conexão. Tente novamente.'}
    finally{button.disabled=false;form.elements.namedItem('password').value=''}
 });
 document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{
    const {data,error}=await supabase.functions.invoke('restaurant-team',{body:{restaurant_id:b.dataset.accept,action:'accept'}});
    if(error||data?.error){alert(data?.error??error?.message??'Convite não pôde ser aceito.');return}
    location.reload();
 });
}

async function waiterHome(user){
 const style='<style>.wg-launch{max-width:840px;margin:0 auto}.wg-launch-hero{background:linear-gradient(120deg,#ff860a,#ef5b00);color:#fff;padding:30px;border-radius:20px;margin:20px 0}.wg-launch-hero h1{font-size:32px;margin:5px 0;letter-spacing:-1px}.wg-launch-hero p{font-size:13px;color:#fff3e7}.wg-launch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.wg-launch-card{padding:20px;border:1px solid #f4e0cd;border-radius:17px;background:#fff}.wg-launch-card h2{font-size:19px;margin:6px 0}.wg-launch-card a{display:inline-block;margin-top:14px;padding:12px 16px;background:#ff7400;color:#fff;border-radius:10px;font-size:13px;font-weight:850}.wg-launch-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.wg-launch-actions button{border:1px solid #ffdfbc;background:#fff7ed;border-radius:11px;padding:11px 15px;color:#b74f00;font-weight:800;cursor:pointer}</style>';
 box(style+'<section class="wg-launch"><div class="wg-launch-hero"><span>INTERVALO · PWA</span><h1>Atendimento do Garçom</h1><p>Escolha seu restaurante para acessar mesas, cardápio e comandas.</p></div><p>Carregando seus restaurantes...</p></section>');
 const [{data:members,error:me},{data:flags,error:fe},{data:overrides,error:oe}]=await Promise.all([
   supabase.from('restaurant_members').select('restaurant_id,role,status,restaurants(id,name,slug,status)').eq('user_id',user.id),
   supabase.from('restaurant_modules').select('restaurant_id,module,enabled').eq('module','garcom'),
   supabase.from('restaurant_member_module_access').select('restaurant_id,module,allowed').eq('user_id',user.id).eq('module','garcom')
 ]);
 if(me||fe||oe){box(style+'<section class="panel">Não foi possível carregar seus restaurantes. Verifique a conexão e atualize a página.</section>');return}
 const available=(members??[]).filter(m=>{
   if(m.status!=='active'||m.restaurants?.status!=='active')return false;
   if(!(flags??[]).some(f=>f.restaurant_id===m.restaurant_id&&f.enabled))return false;
   const override=(overrides??[]).find(f=>f.restaurant_id===m.restaurant_id);
   return m.role==='master'||(override?override.allowed:(permissions[m.role]??[]).includes('garcom'));
 });
 // Permanecer no launcher para permitir instalação com URL 200; abrir restaurante por escolha explícita.
 let html=style+'<section class="wg-launch"><div class="wg-launch-hero"><span>INTERVALO · PWA</span><h1>Atendimento do Garçom</h1><p>Selecione um restaurante. Cada estabelecimento mantém suas comandas separadas.</p></div><div class="wg-launch-grid">';
 for(const m of available)html+='<article class="wg-launch-card"><small>'+esc(m.role)+'</small><h2>'+esc(m.restaurants.name)+'</h2><p class="muted">Acesso liberado</p><a href="'+link('/'+m.restaurants.slug+'/garcom')+'">Abrir mesas e comandas</a></article>';
 html+='</div>';
 if(!available.length)html+='<div class="panel"><h2>Sem acesso ao atendimento</h2><p>Peça ao Master ou Super Admin para habilitar o módulo Garçom e vincular sua conta ao restaurante.</p><a href="'+link('/inicio')+'">Meus restaurantes</a></div>';
 html+='<div class="wg-launch-actions"><button id="wg-launch-install" type="button">Instalar app do garçom</button><a href="'+link('/inicio')+'" class="btn alt">Todos os módulos</a></div></section>';
 box(html);
 document.getElementById('wg-launch-install').onclick=()=>window.intervaloInstallGarcom();
}

const internalModules=['catalogo','mesas','estoque','impressao','relatorios'];
async function tenant(user,slug,mod){
 if(mod==='cardapio'){
  const {renderPublicMenu}=await import('/intervalo/public-menu.js?v=1.0.0-rc.1');
  return renderPublicMenu({supabase,slug,box,esc,link});
 }
 if(!user){location.assign(link('/login'));return}
 const {data:members,error}=await supabase.from('restaurant_members').select('restaurant_id,role,status,restaurants(id,name,slug,status)').eq('user_id',user.id);
 if(error){box(err(error));return}
 const m=members?.find(x=>x.restaurants?.slug===slug&&x.status==='active'&&x.restaurants.status==='active');
 if(!m){box('<section class="panel"><h1>Acesso não autorizado</h1><p>Sua conta não possui vínculo ativo com este restaurante.</p></section>');return}
 const requiredModule=internalModules.includes(mod)?'gestao':mod;
 if(internalModules.includes(mod)&&!['master','manager'].includes(m.role)){
  box('<section class="panel"><h1>Sem permissão</h1><p>Somente Master e gerente com acesso à Gestão podem utilizar esta área.</p></section>');return
 }
 const [{data:moduleRow,error:modErr},{data:override,error:overrideErr}]=await Promise.all([
  supabase.from('restaurant_modules').select('enabled').eq('restaurant_id',m.restaurant_id).eq('module',requiredModule).maybeSingle(),
  supabase.from('restaurant_member_module_access').select('allowed').eq('restaurant_id',m.restaurant_id).eq('user_id',user.id).eq('module',requiredModule).maybeSingle()
 ]);
 if(modErr||overrideErr){box(err(modErr??overrideErr));return}
 const permitted=m.role==='master'||(override?override.allowed:(permissions[m.role]??[]).includes(requiredModule));
 if(!permitted){box('<section class="panel"><h1>Sem permissão</h1><p>Seu papel neste restaurante não permite abrir este módulo.</p></section>');return}
 if(!moduleRow?.enabled){box('<section class="panel"><h1>Módulo ainda não habilitado</h1><p>O Super Admin precisa habilitar este recurso para o estabelecimento.</p>'+btn('Meus restaurantes','/inicio')+'</section>');return}
 if(mod==='gestao'){
  const {renderManagement}=await import('/intervalo/management.js?v=1.0.0-rc.1');
  return renderManagement({supabase,restaurant:m.restaurants,role:m.role,box,esc,link});
 }
 const asset={catalogo:'catalog.js',mesas:'support.js',estoque:'support.js',impressao:'support.js',relatorios:'support.js',garcom:'waiter.js',cozinha:'kitchen.js',caixa:'cash.js'}[mod];
 if(!asset){box('<h1>Módulo não encontrado</h1>');return}
 const {renderPage}=await import('/intervalo/'+asset+'?v=1.0.0-rc.1');
 return renderPage({supabase,restaurant:m.restaurants,module:mod,box,esc,link});
}
async function account(user){
 if(!user){location.assign(link('/login'));return}
 const {renderAccount}=await import('/intervalo/account.js?v=1.0.0-rc.1');
 return renderAccount({supabase,box,esc,link,user});
}
async function start(){const user=await me();if(user?.app_metadata?.intervalo_password_change_required&&!['trocar-senha','login','redefinir','recuperar-senha'].includes(paths[0])){location.assign(link('/trocar-senha'));return}await setupNav(user);if(paths.length===0)return new URLSearchParams(location.search).get('app')==='garcom'
 ?(user?waiterHome(user):location.assign(link('/login?destino=garcom'))):home(user);if(paths[0]==='login')return login();if(paths[0]==='recuperar-senha')return recovery();if(paths[0]==='trocar-senha')return changePassword(user);if(paths[0]==='minha-conta')return account(user);if(paths[0]==='configurar-admin')return setupFirstAdmin();if(paths[0]==='ativar')return setPassword('activation');if(paths[0]==='redefinir')return setPassword('recovery');if(paths[0]==='garcom'&&paths.length===1)return user?waiterHome(user):location.assign(link('/login?destino=garcom'));if(paths[0]==='inicio')return user?choose(user):location.assign(link('/login'));if(paths[0]==='admin')return user?admin(user):location.assign(link('/login'));if(paths.length===2&&(modules.includes(paths[1])||internalModules.includes(paths[1]))&&/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(paths[0]))return tenant(user,paths[0],paths[1]);box('<h1>Página não encontrada</h1>'+btn('Início','/'))}
start().catch(e=>{app.innerHTML='<div class="wrap"><section class="panel"><h1>Não foi possível iniciar o Intervalo</h1><p class="error">'+esc(e.message)+'</p><p>Verifique sua conexão e atualize a página.</p></section></div>'});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/intervalo/sw.js',{scope:'/intervalo/'}).catch(()=>{}));
</script>
