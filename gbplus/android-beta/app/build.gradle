plugins {
    id 'com.android.application'
}
android {
    namespace 'br.com.gaveblue.gbplus.beta'
    compileSdk 36
    defaultConfig {
        applicationId 'br.com.gaveblue.gbplus.beta'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-beta'
    }
    signingConfigs {
        beta {
            // Key exists ONLY on the CI runner and is NOT tracked.
            storeFile file(System.getenv('GB_BETA_KEYSTORE') ?: '/tmp/gbplus-beta-not-configured.jks')
            storePassword System.getenv('GB_BETA_STOREPASS') ?: ''
            keyAlias 'gbplus-beta'
            keyPassword System.getenv('GB_BETA_KEYPASS') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.beta
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
