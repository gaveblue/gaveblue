<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
.gb-ai-widget{position:fixed;right:18px;bottom:40px;z-index:9999;font-family:system-ui,sans-serif}
.gb-ai-widget>summary{list-style:none;cursor:pointer;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#181818;color:white;box-shadow:0 0 0 3px #ffffffbb,0 0 19px #a98fff88,0 8px 24px #0003;font-size:27px;font-weight:500;transition:transform .2s,box-shadow .2s;animation:gb-ai-glow 3s ease-in-out infinite}
.gb-ai-widget>summary:hover{transform:scale(1.07)}
.gb-ai-widget>summary:focus-visible{outline:3px solid #7b9cff;outline-offset:4px}
@keyframes gb-ai-glow{0%,100%{box-shadow:0 0 0 3px #ffffffbb,0 0 12px #a98fff66,0 8px 24px #0003}50%{box-shadow:0 0 0 3px #ffffffbb,0 0 27px #a98fffb0,0 8px 24px #0003}}
@media(prefers-reduced-motion:reduce){.gb-ai-widget>summary{animation:none;transition:none}}
.gb-ai-widget>summary::-webkit-details-marker{display:none}
.gb-ai-widget[open]{inset:0;right:0;bottom:auto;width:100vw;height:var(--gb-ai-visible-height,100dvh);top:var(--gb-ai-visible-top,0px);background:#fff;z-index:10000;display:flex;flex-direction:column}.gb-ai-widget[open]>summary{position:absolute;right:16px;top:10px;z-index:2;width:42px;height:42px;font-size:23px;animation:none;box-shadow:none;background:#f1f1f1;color:#222}.gb-ai-widget[open]>summary::after{content:'×';position:absolute;font-size:23px;background:#f1f1f1;inset:0;display:grid;place-items:center;border-radius:50%}
.gb-ai-widget iframe{display:block;flex:1;min-height:0;position:relative;right:auto;bottom:auto;width:100%;height:100%;border:0;border-radius:0;background:#fff;box-shadow:0 12px 45px #0003}
body.auth-locked .gb-ai-widget{display:none}
@media(max-width:640px){.gb-ai-widget:not([open]){bottom:calc(100px + env(safe-area-inset-bottom));right:12px}.gb-ai-widget[open] iframe{height:100%;min-height:0}}
</style></head>
<body class="auth-locked">
  <main id="auth-gate" aria-label="Acesso ao GB+"><section class="auth-page"><div class="auth-card"><header class="auth-brand"><div class="auth-wordmark">GB<span>+</span></div><p>Gestão Financeira</p></header><p class="auth-description" role="status">Preparando seu acesso…</p><noscript>Ative o JavaScript para entrar no GB+.</noscript></div></section></main>
  <a class="skip" href="#main">Pular para o conteúdo</a>
  <aside class="sidebar" id="sidebar"><a class="brand" href="#dashboard" aria-label="GB+ início"><strong>GB<span>+</span></strong><span>Gestão Financeira</span></a><div class="nav-label">SEU FINANCEIRO</div><nav id="navigation" aria-label="Navegação principal"></nav><div class="sidebar-bottom"><div class="local-mark"><span class="status-dot"></span> Armazenamento local<small>Seus dados, neste navegador.</small></div><button class="theme-button" data-action="theme"></button><div class="version">GB+ <span>Versão 1.2</span></div></div></aside>
  <div class="workspace"><header class="topbar"><span class="breadcrumb">Workspace <span>/</span> <b id="breadcrumb">Visão geral</b></span><a class="mobile-brand" href="#dashboard">GB+</a><div class="top-actions"><span id="connection" class="connection">Disponível offline</span><button class="icon-button" data-action="search" aria-label="Pesquisar lançamentos"></button><button class="icon-button" data-action="notifications" aria-label="Ver títulos vencidos"></button><span class="avatar" title="Meu financeiro">GB</span></div></header><main id="main" tabindex="-1"></main><footer class="desktop-footer">Uma visão clara. Decisões melhores.<span>GB+ · Gestão Financeira</span></footer></div>
  <details class="gb-ai-widget"><summary aria-label="Abrir ou fechar assistente financeiro">✦</summary><iframe title="Assistente financeiro GB+ AI" src="./ai-lab/" loading="lazy"></iframe></details>
  <nav class="mobile-nav" id="mobile-navigation" aria-label="Navegação móvel"></nav>
  <dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
  <noscript>Ative o JavaScript para usar o GB+. Os dados são armazenados neste navegador.</noscript>
<script>
(()=>{const panel=document.querySelector('.gb-ai-widget');const vv=window.visualViewport;
function sync(){if(!panel.open)return;const height=vv?vv.height:window.innerHeight;const top=vv?vv.offsetTop:0;panel.style.setProperty('--gb-ai-visible-height',Math.round(height)+'px');panel.style.setProperty('--gb-ai-visible-top',Math.round(top)+'px');}
panel.addEventListener('toggle',()=>{if(panel.open){sync();document.documentElement.style.overflow='hidden';}else{document.documentElement.style.overflow='';panel.style.removeProperty('--gb-ai-visible-height');panel.style.removeProperty('--gb-ai-visible-top');}});
vv?.addEventListener('resize',sync);vv?.addEventListener('scroll',sync);window.addEventListener('resize',sync);
})();
</script>
  <script src="./js/update.js"></script>
  <script src="./vendor/supabase-2.118.0.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
