  <style>
  /* Full-bleed access screen, applied before the main app stylesheet is painted. */
  html[data-boot="auth"],html[data-boot="auth"] body{background:#fff!important;margin:0!important}
  body.auth-locked #auth-gate{position:fixed!important;inset:0!important;width:100%!important;height:100dvh!important;max-width:none!important;margin:0!important;padding:0!important;background:#fff!important;z-index:50}

  </style>
  <script>
  // First-time mobile visitors see the institutional page before installation.
  // Installed apps, signed-in/returning users, callbacks and desktop visitors stay here.
  (() => {
    try {
      if (!matchMedia('(max-width:760px) and (pointer:coarse)').matches) return;
      // Touchscreen desktop/laptop users should keep the normal web login.
      const userAgent = String(navigator.userAgent || '');
      if (/Windows NT|X11|Linux x86_64/i.test(userAgent)) return;
      if (navigator.userAgentData?.mobile === false && !/Android|iPhone|iPad|iPod/i.test(userAgent)) return;
      if (matchMedia('(display-mode:standalone)').matches || navigator.standalone === true) return;
      // Auth callbacks and explicit web links are never redirected.
      const params = new URLSearchParams(location.search);
      if ([...params.keys()].some(key => !key.startsWith('utm_') && !['ref','source'].includes(key))) return;
      if (location.hash && location.hash !== '#dashboard') return;
      const existingSession = Object.keys(localStorage).some(key => /^sb-.+-auth-token$/.test(key));
      const existingData = localStorage.getItem('gb-plus:data:v1') !== null;
      const usedBefore = ['gbplus-appearance-v1','gbplus-pwa-suggest-after-v1'].some(key => localStorage.getItem(key) !== null);
      const seen = localStorage.getItem('gbplus-install-intro-seen-v1') === '1';
      if (seen || existingSession || existingData || usedBefore) return;
      location.replace('./apresentacao.html?origem=link');
    } catch { /* Never block the existing GB+ app if browser storage is unavailable. */ }
  })();
  document.documentElement.dataset.boot='auth';
  // Apply the last GB+ appearance before first paint so Android does not latch a light navigation bar.
  (()=>{
   let theme='light';
   try{
    const saved=localStorage.getItem('gbplus-appearance-v1');
    theme=saved==='dark'||saved==='light'?saved:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
   }catch{theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
   const color=theme==='dark'?'#111214':'#f6f6f8';
   document.documentElement.dataset.theme=theme;
   document.documentElement.style.colorScheme=theme;
   document.documentElement.style.backgroundColor=color;
   document.querySelector('meta[name="theme-color"]').content=color;
  })();
  </script>

:root[data-theme="dark"] .gb-ai-widget[open]>summary::after{background:#292a30;color:#f1f1f5}
