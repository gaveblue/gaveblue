name: GB+ abertura - regressao 3.0.x
on:
  push:
    branches:
      - feat/gbplus-301-splash-reveal
  pull_request:
    paths:
      - 'gbplus/**'
      - '.github/workflows/gbplus-301-splash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  splash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar abertura GB+ instalada
        run: |
          if grep -q '"version": "3.0.4"' gbplus/version.json; then
            node gbplus/tests/gbplus-304-white-orbit.mjs
          elif grep -q '"version": "3.0.3"' gbplus/version.json; then
            node gbplus/tests/gbplus-303-splash-regression.mjs
          elif grep -q '"version": "3.0.2"' gbplus/version.json; then
            node gbplus/tests/gbplus-302-brand-start.mjs
          else
            node gbplus/tests/gbplus-301-splash-regression.mjs
          fi
