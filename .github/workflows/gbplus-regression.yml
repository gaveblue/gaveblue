name: GB+ — regressões financeiras

on:
  push:
    branches:
      - 'feature/gbplus-250-build7-homologacao'
    paths:
      - 'gbplus/**'
      - '.github/workflows/gbplus-regression.yml'
  pull_request:
    paths:
      - 'gbplus/**'
      - '.github/workflows/gbplus-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regressões anteriores
        run: node gbplus/tests/finance-regression.mjs
      - name: Unificação de Contas e Cartões (2.5.1)
        run: node gbplus/tests/accounts-cards-unified-regression.mjs
      - name: Leitura OFX e CSV
        run: node gbplus/tests/bank-import-preview-regression.mjs
      - name: Mapeamento manual de CSV não padronizado
        run: node gbplus/tests/bank-import-mapping-regression.mjs
      - name: Leitura de extratos em codificações bancárias
        run: node gbplus/tests/bank-import-codec-regression.mjs
      - name: Garantia de bloqueio financeiro na liberação pública
        run: node gbplus/tests/bank-import-readonly-release-regression.mjs
      - name: Comparação indicativa de saldos OFX/CSV
        run: node gbplus/tests/bank-import-balance-regression.mjs
      - name: Novo lançamento em 3 etapas e baixa atômica (2.7.1)
        run: node gbplus/tests/title-three-step-regression.mjs
      - name: Bottom sheet arrastável e ícones (2.7.0)
        run: node gbplus/tests/bottom-sheet-regression.mjs
      - name: Formulário PF e serviços dentro da categoria (2.6.3)
        run: node gbplus/tests/pf-entry-ui-regression.mjs
      - name: Redefinição financeira e exclusão de conta (2.6.1)
        run: node gbplus/tests/account-safety-regression.mjs
      - name: Catálogo de serviços e identificação opcional (2.6.0)
        run: node gbplus/tests/services-regression.mjs
      - name: Importação intuitiva e seleção múltipla (2.5.2)
        run: node gbplus/tests/bank-import-usability-regression.mjs
      - name: Conciliação e histórico
        run: node gbplus/tests/bank-reconciliation-regression.mjs
      - name: Criação e reversão de lançamentos importados
        run: node gbplus/tests/bank-reconciliation-create-regression.mjs
      - name: Pendências retomáveis e reversão encadeada
        run: node gbplus/tests/bank-reconciliation-pending-regression.mjs
      - name: Persistência local, concorrência e rollback de saldo
        run: node gbplus/tests/bank-reconciliation-storage-regression.mjs
