name: Compilar GB+ EasyUI Charts
on:
  push:
    branches:
      - feature/gbplus-easyui-charts-227
    paths:
      - "gbplus/react-charts/**"
      - "gbplus/js/gb-charts-data.js"
      - ".github/workflows/gbplus-easyui-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gbplus-easyui-${ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe do aplicativo sem alterar arquivos financeiros
        run: |
          node --check gbplus/js/app.js
          node --check gbplus/js/views.js
          node --check gbplus/js/gb-react-loader.js
          node --check gbplus/js/gb-charts-data.js
          node --check gbplus/sw.js
          node gbplus/react-charts/test-bridge.mjs
      - name: Instalar dependências no ambiente isolado de gráficos
        working-directory: gbplus/react-charts
        run: npm install --no-fund --no-audit
      - name: Compilar React, EasyUI e Tailwind CSS
        working-directory: gbplus/react-charts
        run: npm run build
      - name: Validar artefatos estáticos
        run: |
          test -s gbplus/charts-dist/gb-react-charts.js
          test -s gbplus/charts-dist/gb-react-charts.css
          du -h gbplus/charts-dist/*
      - name: Publicar apenas os arquivos compilados nesta ramificação
        if: startsWith(github.ref, 'refs/heads/feature/gbplus-easyui-charts-227')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gbplus/charts-dist/ gbplus/react-charts/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(charts): versioned EasyUI React bundle [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
