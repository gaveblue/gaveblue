name: GB+ Android Beta APK (somente testes)

on:
  push:
    branches:
      - experiment/gbplus-android-beta-apk
    paths:
      - 'gbplus/android-beta/**'
      - '.github/workflows/android-beta-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-beta:
    name: Compilar e verificar APK de teste
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Instalar Node 22 para verificações estáticas
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar política de segurança antes de compilar
        run: node gbplus/android-beta/scripts/security-check.mjs
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Criar chave de assinatura TEMPORARIA (sem armazenar em repo)
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          KEYSTORE="$RUNNER_TEMP/gbplus-beta-signing.jks"
          keytool -genkeypair -noprompt -alias gbplus-beta -keyalg RSA -keysize 3072 -validity 90 -dname "CN=GB+ Android Beta,O=GB+ Experimental,C=BR" -storetype PKCS12 -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS"
          echo "GB_BETA_STOREPASS=$PASS" >> "$GITHUB_ENV"
          echo "GB_BETA_KEYPASS=$PASS" >> "$GITHUB_ENV"
          echo "GB_BETA_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Gerar APK release (sem debug e sem listener)
        run: gradle -p gbplus/android-beta --no-daemon --stacktrace :app:assembleRelease
      - name: Verificar assinatura e SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="gbplus/android-beta/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p gbplus/android-beta/dist
          cp "$APK" gbplus/android-beta/dist/GBPlus-Android-Beta-0.1.0.apk
          cd gbplus/android-beta/dist
          sha256sum GBPlus-Android-Beta-0.1.0.apk > SHA256SUMS.txt
          printf 'GB+ Android BETA. Certificado TEMPORARIO. SEM leitura de notificacoes. NAO HOMOLOGADO para uso financeiro.\n' > LEIA-ANTES.txt
      - name: Anexar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: GBPlus-Android-Beta-APK-e-SHA256
          path: gbplus/android-beta/dist/
          if-no-files-found: error
          retention-days: 14
