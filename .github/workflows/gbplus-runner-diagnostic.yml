name: GB+ - diagnostico de runner

on:
  push:
    branches: ['fix/gbplus-security-ci-20261107']
    paths:
      - '.github/workflows/gbplus-runner-diagnostic.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gbplus-runner-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Acesso basico a runner GitHub-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirmar inicializacao do runner
        run: |
          echo "RUNNER_STARTED"
          echo "GITHUB_SHA=$GITHUB_SHA"
          node --version
